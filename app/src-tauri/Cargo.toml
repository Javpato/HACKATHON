[package]
name = "studyvillage"
version = "0.2.3"
description = "A local-first village for studying together"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "studyvillage_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "studyvillage"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:base64"]

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true , features = [] }

[dependencies]
tauri = { version = "=2.12.5", optional = true , features = [] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "=0.17.2", optional = true }
base64 = { version = "=0.22.1", optional = true }

